name: sprawozdanie
on: push
jobs: 
  pdf:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install scipy pint matplotlib open_atmos_jupyter_utils
      - run: sudo apt-get install texlive-xetex inkscape pandoc # dla pdf
      - run: pip install nbconvert ipykernel numba PyMPDATA
      - run: python -m ipykernel install --user
      - run: python -m nbconvert --to notebook --execute project_shallow_water/mc_projekt.ipynb # dla pdf
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-polish texlive-xetex
      - run: pdflatex raport.tex
      # - run: python -m nbconvert --to script --execute mpdata_2d_numpy_only.ipynb # dla gifa i innych rzeczy (idzie o wiele szybciej)
      - uses: actions/upload-artifact@v4
        with: 
          name: reports
          path: |
            raport.pdf
            project_shallow_water/reflection.gif